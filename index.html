// الوصول لعناصر الصفحة
const el = id => document.getElementById(id);

// تحويل النص لشكل آمن داخل HTML
function esc(t){
return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// بديل alert: رسالة صغيرة تظهر وتختفي (لأن alert ممكن يتمنع في بعض المتصفحات)
let toastTimer = null;
window.alert = function(message){
const t = el("toast");
t.textContent = message;
t.classList.remove("hidden");
clearTimeout(toastTimer);
toastTimer = setTimeout(() => t.classList.add("hidden"), 2800);
};

// بديل prompt و confirm: نافذة من تصميمنا
// fields: [{label, value, type:"text" | "area" | "check"}]
// بترجّع مصفوفة القيم، أو null لو المستخدم ضغط إلغاء
function dialog(title, fields){
return new Promise(resolve => {
const box = el("modal");

box.innerHTML = `<div class="modalBox"><h3>${esc(title)}</h3>` +
fields.map((f,i) =>
f.type === "check" ?
`<label class="chk"><input type="checkbox" id="mf${i}"> ${esc(f.label)}</label>` :
f.type === "select" ?
`<label class="muted">${esc(f.label || "")}</label><select id="mf${i}">${f.options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")}</select>` :
f.type === "area" ?
`<label class="muted">${esc(f.label || "")}</label><textarea id="mf${i}" rows="4"></textarea>` :
`<label class="muted">${esc(f.label || "")}</label><input id="mf${i}">`
).join("") +
`<div class="actions"><button class="green" id="mOk">موافق</button><button class="gray" id="mNo">إلغاء</button></div></div>`;

fields.forEach((f,i) => {
const input = el("mf" + i);
if(f.type === "check") input.checked = !!f.value;
else input.value = f.value || "";
});

box.classList.remove("hidden");
if(fields.length && fields[0].type !== "check") el("mf0").focus();

const close = value => {
box.classList.add("hidden");
box.innerHTML = "";
resolve(value);
};

el("mOk").onclick = () => close(fields.map((f,i) =>
f.type === "check" ? el("mf" + i).checked : el("mf" + i).value.trim()
));
el("mNo").onclick = () => close(null);
});
}

// ترتيب الفصول: ابتدائي ثم إعدادي، ثم السنة، ثم رقم الفصل
function sortClasses(list){
const rank = c => {
const m = c.match(/^(\d+)\/(\d+)\s+(.+)$/);
if(!m) return [9, 99, 99];
return [m[3] === "ابتدائي" ? 0 : m[3] === "إعدادي" ? 1 : 2, +m[1], +m[2]];
};
return list.slice().sort((a,b) => {
const x = rank(a), y = rank(b);
return (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]);
});
}

let classNames = sortClasses(load("classes", defaultClassNames));

// التخزين
function load(key, fallback){
try {
const value = localStorage.getItem(key);
return value === null ? fallback : JSON.parse(value);
} catch(error) {
return fallback;
}
}

function save(key, value){
localStorage.setItem(key, JSON.stringify(value));
}

if(localStorage.getItem("students") === null) save("students", initialStudents);
if(localStorage.getItem("teachers") === null) save("teachers", initialTeachers);
if(localStorage.getItem("admins") === null) save("admins", initialAdmins);

// نتأكد إن الأدمن الرئيسي موجود حتى لو البيانات القديمة محفوظة في المتصفح
(function ensureSuperAdmin(){
const admins = load("admins", []);
const existing = admins.find(a => a.id === "a0");
if(!existing){
admins.unshift({...superAdminAccount});
save("admins", admins);
} else if(!existing.superAdmin){
existing.superAdmin = true;
save("admins", admins);
}
})();

let user = null;

// تسجيل الدخول
function login(){
const code = el("loginCode").value.trim();
const students = load("students", []);
const teachers = load("teachers", []);
const admins = load("admins", []);

const student = students.find(x => x.code === code);
const teacher = teachers.find(x => x.code === code);
const admin = admins.find(x => x.code === code);

user = student ? {...student,type:"student"} :
       teacher ? {...teacher,type:"teacher"} :
       admin ? {...admin,type:"admin"} : null;

if(!user){
el("loginError").textContent = "الكود غير صحيح";
return;
}

el("loginError").textContent = "";
localStorage.setItem("resalaSession", JSON.stringify(user));
showApp();
}

function logout(){
localStorage.removeItem("resalaSession");
location.reload();
}

// عرض التطبيق
function showApp(){
el("login").classList.add("hidden");
el("app").classList.remove("hidden");

el("welcome").textContent = "أهلاً " + user.name;

el("info").textContent = user.type === "student" ?
"حساب طالب - " + user.className :
user.type === "teacher" ?
"معلم - " + user.subject :
user.superAdmin ? "أدمن رئيسي" : "حساب إداري";

const names = user.type === "student" ?
["الجدول","الباص","الأخبار","الإشعارات"] :
user.type === "teacher" ?
["الجدول","الباص","الرسائل"] :
["الأخبار","الباص","الشكاوى","التعديلات"];

const ids = user.type === "student" ?
["schedule","bus","news","notifications"] :
user.type === "teacher" ?
["schedule","bus","messages"] :
["news","bus","complaints","edits"];

el("tabs").innerHTML = names.map((name,i) =>
`<button onclick="openTab('${ids[i]}')">${name}</button>`
).join("");

openTab(ids[0]);
}

function openTab(id){
const p = el("page");
if(id === "schedule") schedulePage(p);
if(id === "bus") busPage(p);
if(id === "news") newsPage(p);
if(id === "notifications") notificationsPage(p);
if(id === "messages") messagesPage(p);
if(id === "complaints") complaintsPage(p);
if(id === "edits") editsPage(p);
}

// الباص والحضور
function resetDaily(){
const d = new Date();
const key = [d.getFullYear(),d.getMonth(),d.getDate()].join("-");

if(d.getHours() >= 16 && localStorage.getItem("resetDate") !== key){
save("movement", {});
save("attendance", {});
localStorage.setItem("resetDate", key);
}
}

function busPage(p){

const students = load("students", []);

const movement = load("movement", {});

if(user.type === "student"){

p.innerHTML = '<div class="card">أنت غير مشترك في خدمة الباص</div>';

`).join("") || "لا يوجد طلاب."}

attendance[user.id] = value;

function addNews(){
const title = el("newsTitle").value.trim();
const body = el("newsBody").value.trim();

if(!title || !body) return alert("اكتب العنوان والتفاصيل");

const news = load("news", []);
news.push({title,body});
save("news", news);
newsPage(el("page"));
}

function delNews(index){
const news = load("news", []);
news.splice(index,1);
save("news", news);
newsPage(el("page"));
}

// الرسائل
function addMessage(id, message, from){
const messages = load("messages", {});
if(!messages[id]) messages[id] = [];

messages[id].push({
msg:message,
from,
date:new Date().toLocaleString("ar-EG")
});

save("messages", messages);
}

async function sendMsg(id){
const student = load("students", []).find(x => x.id === id);
if(!student) return;

const result = await dialog("رسالة إلى " + student.name, [
{label:"نص الرسالة", type:"area"}
]);

if(result && result[0]){
addMessage(id, result[0], user.name);
alert("تم إرسال الرسالة");
}
}

function addClass(){
const stage = el("newClassStage").value;
const year = parseInt(el("newClassYear").value, 10);
const section = parseInt(el("newClassSection").value, 10);
const maxYear = stage === "ابتدائي" ? 6 : 3;

if(!year || !section || year < 1 || year > maxYear || section < 1){
return alert("اكتب سنة من 1 إلى " + maxYear + " ورقم فصل صحيح");
}

const name = year + "/" + section + " " + stage;
if(classNames.includes(name)) return alert("الفصل موجود بالفعل");

saveClassNames([...classNames, name]);
alert("تمت إضافة الفصل " + name);
editClassList();
}

async function removeClass(index){
const name = classNames[index];
if(!name) return;

const used = load("students", []).filter(s => s.className === name).length;
if(used > 0){
return alert("لا يمكن حذف الفصل، فيه " + used + " طالب. انقلهم لفصل آخر أولاً");
}

if(!(await dialog("حذف الفصل " + name + "؟", []))) return;

saveClassNames(classNames.filter(c => c !== name));
alert("تم حذف الفصل");
editClassList();
}

function editClasses(){
el("editArea").innerHTML = `
<h3>جداول الفصول</h3>
<select id="classSelect">
${classNames.map(x => `<option>${x}</option>`).join("")}
</select>
<input id="classImage" type="file" accept="image/*">
<button onclick="uploadClass()">رفع أو تغيير صورة الجدول</button>`;
}

function uploadClass(){
const file = el("classImage").files[0];
if(!file) return alert("اختر صورة");

const reader = new FileReader();
reader.onload = () => {
try {
localStorage.setItem("schedule_class_" + el("classSelect").value, reader.result);
alert("تم حفظ الجدول");
} catch(error) {
alert("الصورة كبيرة جداً، اختر صورة أصغر");
}
};
reader.readAsDataURL(file);
}

function editTeachers(){
const teachers = load("teachers", []);

el("editArea").innerHTML = `
<h3>جداول المعلمين وبياناتهم</h3>
${teachers.map(t => `
<div class="item">
<b>${t.name}</b> - ${t.subject}
<p>${(t.classes || []).join("، ")}</p>
<input type="file" id="img_${t.id}" accept="image/*">

if(!file) return alert("اختر صورة");

const reader = new FileReader();
reader.onload = () => {
try {
localStorage.setItem("schedule_teacher_" + id, reader.result);

async function changeTeacher(id){
const teachers = load("teachers", []);
const teacher = teachers.find(x => x.id === id);
if(!teacher) return;

const result = await dialog("تعديل بيانات المدرس", [
{label:"اسم المدرس", value:teacher.name},
{label:"المادة", value:teacher.subject},
{label:"الفصول مفصولة بفاصلة", value:(teacher.classes || []).join(",")},
{label:"مشرف باص", type:"check", value:teacher.bus}
]);
if(!result) return;

const oldName = teacher.name;
const [name, subject, classes, isBus] = result;

teacher.name = name || teacher.name;
teacher.subject = subject || teacher.subject;
teacher.classes = classes.split(",").map(x => x.trim()).filter(Boolean);
teacher.bus = isBus;

// لو اسم المشرف اتغير، نحدّث اسمه عند طلاب الباص
if(oldName !== teacher.name){
const students = load("students", []);
students.forEach(s => { if(s.bus === oldName) s.bus = teacher.name; });
save("students", students);
}

save("teachers", teachers);

// نرجع لنفس الشاشة اللي جينا منها
if(el("accountDetails")) editAccounts();
else editTeachers();
}

// إدارة الباصات
// قائمة مشرفي الباص: كل معلم أو إداري عليه علامة "مشرف باص"
function busOptions(current){
const names = [
...load("teachers", []).filter(t => t.bus).map(t => t.name),
...load("admins", []).filter(a => a.bus).map(a => a.name)
];
// نحافظ على الباص الحالي للطالب حتى لو صاحبه مالوش حساب مشرف
if(current && !names.includes(current)) names.push(current);
return [...new Set(names)];
}

function busSelectHtml(selected){
return '<option value="">غير مشترك</option>' +
busOptions(selected).map(n =>
`<option value="${esc(n)}" ${n === selected ? "selected" : ""}>${esc(n)}</option>`
).join("");
}

function editBuses(){
const students = load("students", []);

el("editArea").innerHTML = `
<h3>تعديل اشتراكات الباص</h3>
${students.map(s => `
<div class="item">
<b>${s.name}</b> - ${s.className}
<select id="bus_${s.id}">
${busSelectHtml(s.bus)}
</select>
<button onclick="saveBus('${s.id}')">حفظ التعديل</button>
</div>
`).join("")}`;
}

function saveBus(id){
const students = load("students", []);
const student = students.find(x => x.id === id);
if(!student) return;

student.bus = el("bus_" + id).value;
save("students", students);
editBuses();
alert("تم الحفظ");
}

// الحسابات والأكواد
function editAccounts(){
el("editArea").innerHTML = `
<h3>حسابات الطلاب</h3>
<p class="muted">اختر الفصل لإدارة الطلاب وإرسال رسالة فردية.</p>

<div class="grid">
${classNames.map((c,i) =>
`<button class="gray" onclick="showClass(${i})">${c}</button>`
).join("")}
</div>

<hr>
<h3>حسابات المدرسين</h3>
<button onclick="showTeachers('p123')">ابتدائي أول إلى ثالث</button>
<button onclick="showTeachers('p456')">ابتدائي رابع إلى سادس</button>
<button onclick="showTeachers('prep')">إعدادي</button>

<hr>
<h3>الإداريون</h3>
<button class="gray" onclick="showAdmins()">عرض الإداريين</button>

<div id="accountDetails">
<p class="muted">اختر فصلاً أو مجموعة.</p>
</div>

<hr>
<h3>إضافة طالب</h3>
<input id="newStudentName" placeholder="اسم الطالب">
<input id="newStudentCode" placeholder="الكود A + ستة أرقام">
<select id="newStudentClass">
${classNames.map(c => `<option>${c}</option>`).join("")}
</select>
<label class="muted">الباص</label>
<select id="newStudentBus">${busSelectHtml("")}</select>
<button class="green" onclick="addStudent()">إضافة الطالب</button>

<hr>
<h3>إضافة مدرس</h3>
<input id="newTeacherName" placeholder="اسم المدرس">
<input id="newTeacherCode" placeholder="الكود B + ستة أرقام">
<input id="newTeacherSubject" placeholder="المادة">
<input id="newTeacherClasses" placeholder="الفصول مفصولة بفاصلة">
<label class="chk"><input type="checkbox" id="newTeacherBus"> مشرف باص</label>
<button class="green" onclick="addTeacher()">إضافة المدرس</button>

${user.superAdmin ? `
<hr>
<h3>إضافة إداري (للأدمن الرئيسي فقط)</h3>
<input id="newAdminName" placeholder="اسم الإداري">
<input id="newAdminCode" placeholder="الكود C + ستة أرقام">
<label class="chk"><input type="checkbox" id="newAdminBus"> مشرف باص</label>
<button class="green" onclick="addAdmin()">إضافة الإداري</button>` : ""}`;
}

function showClass(index){
const className = classNames[index];
const students = load("students", []).filter(s => s.className === className);

el("accountDetails").innerHTML = `
<h3>طلاب ${className}</h3>
${students.map(s => `
<div class="item">
<b>${s.name}</b>
<p class="muted">الكود: ${s.code}</p>
<input id="code_${s.id}" value="${s.code}">
<div class="actions">
<button onclick="saveCode('${s.id}')">حفظ الكود</button>
<button class="orange" onclick="editStudent('${s.id}')">تعديل البيانات</button>
<button class="orange" onclick="sendMsg('${s.id}')">إرسال رسالة</button>
<button class="red" onclick="deleteAccount('${s.id}','student')">حذف الطالب</button>
</div>
</div>
`).join("") || "لا يوجد طلاب"}
`;
}

async function editStudent(id){
const students = load("students", []);
const student = students.find(x => x.id === id);
if(!student) return;

const classList = classNames.includes(student.className) ? classNames : [...classNames, student.className];

const result = await dialog("تعديل بيانات الطالب", [
{label:"اسم الطالب", value:student.name},
{label:"الفصل", type:"select", value:student.className, options:classList.map(c => ({value:c,label:c}))},
{label:"الباص", type:"select", value:student.bus || "", options:[{value:"",label:"غير مشترك"}, ...busOptions(student.bus).map(n => ({value:n,label:n}))]}
]);
if(!result || !result[0]) return;

student.name = result[0];
student.className = result[1];
student.bus = result[2];
save("students", students);
alert("تم حفظ بيانات الطالب");

const index = classNames.indexOf(student.className);
editAccounts();
if(index >= 0) showClass(index);
}

function showTeachers(group){
const teachers = load("teachers", []).filter(t =>
(t.classes || []).some(c =>
group === "p123" ? /^[123]\//.test(c) && c.includes("ابتدائي") :
group === "p456" ? /^[456]\//.test(c) && c.includes("ابتدائي") :
c.includes("إعدادي")
));

el("accountDetails").innerHTML = `
<h3>المدرسون</h3>
${teachers.map(t => `
<div class="item">
<b>${t.name}</b>
<p>${t.subject} - ${(t.classes || []).join("، ")}</p>
<p class="muted">الكود: ${t.code}</p>
<input id="code_${t.id}" value="${t.code}">
<div class="actions">
<button onclick="saveCode('${t.id}')">حفظ الكود</button>
<button class="orange" onclick="changeTeacher('${t.id}')">تعديل البيانات</button>
<button class="red" onclick="deleteAccount('${t.id}','teacher')">حذف المدرس</button>
</div>
</div>
`).join("") || "لا يوجد مدرسون في هذه المجموعة"}
`;
}

function showAdmins(){
const admins = load("admins", []);

// الأدمن الرئيسي: يعدل الأكواد والأسماء ويحذف. الإداري العادي: عرض فقط.
if(user.superAdmin){
el("accountDetails").innerHTML = `
<h3>الإداريون</h3>
${admins.map(a => `
<div class="item">
<b>${a.name}</b> ${a.superAdmin ? "(أدمن رئيسي)" : ""} ${a.bus ? "(مشرف باص)" : ""}
<p class="muted">الكود: ${a.code}</p>
<input id="code_${a.id}" value="${a.code}">
<div class="actions">
<button onclick="saveCode('${a.id}')">حفظ الكود</button>
<button class="orange" onclick="renameAdmin('${a.id}')">تعديل البيانات</button>
${a.id === user.id ? "" :
`<button class="red" onclick="deleteAccount('${a.id}','admin')">حذف الإداري</button>`}
</div>
</div>
`).join("")}`;
return;
}

el("accountDetails").innerHTML = `
<h3>الإداريون</h3>
${admins.map(a => `
<div class="item">
<b>${a.name}</b>
<p class="muted">الكود: ${a.code}</p>
</div>
`).join("")}`;
}

async function renameAdmin(id){
if(!user.superAdmin) return;
const admins = load("admins", []);
const admin = admins.find(x => x.id === id);
if(!admin) return;

const result = await dialog("تعديل بيانات الإداري", [
{label:"الاسم", value:admin.name},
{label:"مشرف باص", type:"check", value:admin.bus}
]);
if(!result || !result[0]) return;

const oldName = admin.name;
admin.name = result[0];
admin.bus = result[1];

if(oldName !== admin.name){
const students = load("students", []);
students.forEach(s => { if(s.bus === oldName) s.bus = admin.name; });
save("students", students);
}
save("admins", admins);
showAdmins();
}

async function deleteAccount(id,type){
if(type !== "student" && type !== "teacher" && type !== "admin") return;
if(type === "admin"){
if(!user.superAdmin) return alert("هذه الصلاحية للأدمن الرئيسي فقط");
if(id === user.id) return alert("لا يمكنك حذف حسابك");
}
if(!(await dialog("تأكيد حذف الحساب؟", []))) return;

const key = type === "student" ? "students" : type === "teacher" ? "teachers" : "admins";
save(key, load(key, []).filter(x => x.id !== id));

editAccounts();
alert("تم حذف الحساب");
}

function codeExists(code){
return [
...load("students", []),
...load("teachers", []),
...load("admins", [])
].some(x => x.code === code);
}

function saveCode(id){
const students = load("students", []);
const teachers = load("teachers", []);
const admins = load("admins", []);

let account = students.find(x => x.id === id);
let key = "students";

if(!account){
account = teachers.find(x => x.id === id);
key = "teachers";
}
if(!account){
account = admins.find(x => x.id === id);
key = "admins";
}
if(!account) return;

if(key === "admins" && !user.superAdmin){
return alert("هذه الصلاحية للأدمن الرئيسي فقط");
}

const code = el("code_" + id).value.trim();
const prefix = key === "students" ? "A" : key === "teachers" ? "B" : "C";

if(!(new RegExp("^" + prefix + "\\d{6}$")).test(code)){
return alert("الكود يجب أن يبدأ بـ " + prefix + " وبعده 6 أرقام");
}

const all = [...students,...teachers,...admins];
if(all.some(x => x.code === code && x.id !== id)){
return alert("الكود مستخدم بالفعل");
}

account.code = code;
save(key, key === "students" ? students : key === "teachers" ? teachers : admins);
alert("تم تغيير الكود");
editAccounts();
}

function addStudent(){
const name = el("newStudentName").value.trim();
const code = el("newStudentCode").value.trim();
const className = el("newStudentClass").value;
const bus = el("newStudentBus").value;

if(!name || !code) return alert("اكتب الاسم والكود");
if(!/^A\d{6}$/.test(code)) return alert("استخدم A وبعده 6 أرقام");
if(codeExists(code)) return alert("الكود مستخدم");

const students = load("students", []);
students.push({
id:"s" + Date.now(),
name,
code,
grade:"",
className,
bus
});

save("students", students);
alert("تمت إضافة الطالب");
editAccounts();
}

function addTeacher(){
const name = el("newTeacherName").value.trim();
const code = el("newTeacherCode").value.trim();
const subject = el("newTeacherSubject").value.trim();
const classes = el("newTeacherClasses").value.split(",").map(x => x.trim()).filter(Boolean);

if(!name || !code || !subject) return alert("أكمل الاسم والكود والمادة");
if(!/^B\d{6}$/.test(code)) return alert("استخدم B وبعده 6 أرقام");
if(codeExists(code)) return alert("الكود مستخدم");

const teachers = load("teachers", []);
teachers.push({
id:"t" + Date.now(),
name,
code,
subject,
classes,
bus:el("newTeacherBus").checked
});

save("teachers", teachers);
alert("تمت إضافة المدرس");
editAccounts();
}

function addAdmin(){
if(!user.superAdmin) return alert("هذه الصلاحية للأدمن الرئيسي فقط");

const name = el("newAdminName").value.trim();
const code = el("newAdminCode").value.trim();

if(!name || !code) return alert("اكتب الاسم والكود");
if(!/^C\d{6}$/.test(code)) return alert("استخدم C وبعده 6 أرقام");
if(codeExists(code)) return alert("الكود مستخدم");

const admins = load("admins", []);
admins.push({
id:"a" + Date.now(),
name,
code,
bus:el("newAdminBus").checked
});

save("admins", admins);
alert("تمت إضافة الإداري");
editAccounts();
}

// استعادة جلسة الدخول
try{
const old = JSON.parse(localStorage.getItem("resalaSession"));

if(old){
const all = [
...load("students", []),
...load("teachers", []),
...load("admins", [])
];

const fresh = all.find(x => x.id === old.id);

if(fresh){
user = {...fresh,type:old.type};
showApp();
}
}
}catch(error){
localStorage.removeItem("resalaSession");
}
</script>
